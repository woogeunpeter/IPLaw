<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>법조문 모드</title>
  <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>
  <header class="topbar">
    <a href="./index.html" class="btn ghost">← 홈</a>
    <div class="brand">⚖️ 법조문 모드</div>
  </header>

  <main class="wrap screen">
    <aside class="sidebar">
      <div class="side-header">
        <select id="lawSelectStat" class="input">
          <option value="patent" selected>특허법(총칙)</option>
        </select>
        <input id="searchStat" class="input" placeholder="번호·제목·내용·메모 검색 (띄어쓰기 분할)">
        <div class="filters">
          <label class="chip"><input type="checkbox" id="onlyBookmarks"> 북마크</label>
          <label class="chip">별점≥
            <select id="minStars" class="input input-compact">
              <option value="0" selected>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            </select>
          </label>
        </div>
      </div>
      <div id="tocStat" class="toc"></div>
    </aside>

    <section class="content">
      <div class="content-header">
        <div class="row gap">
          <button id="prevStat" class="btn ghost">이전</button>
          <button id="nextStat" class="btn">다음</button>
        </div>
      </div>
      <article id="viewerStat" class="viewer" hidden>
        <div class="article-head">
          <h1 id="titleStat">제0조 제목</h1>
          <div class="row gap">
            <div id="starRow" class="stars editable" title="중요도">★★★★★</div>
            <button id="bmBtn" class="btn ghost" title="북마크">☆ 북마크</button>
            <a id="toQuiz" class="btn" href="./quiz.html">이 조문 퀴즈</a>
            <div class="row gap">
              <button id="markOStat" class="btn small">O</button>
              <button id="markXStat" class="btn small">X</button>
              <button id="markClearStat" class="btn small ghost">취소</button>
            </div>
          </div>
        </div>
        <div id="bodyStat" class="body"></div>
        <div class="note-area">
          <div class="note-toolbar">
            <span class="muted">메모</span>
            <div class="spacer"></div>
            <button id="noteClear" class="btn ghost" title="메모 지우기">지우기</button>
            <span id="noteStatus" class="muted">자동 저장됨</span>
          </div>
          <textarea id="noteStat" class="textarea autosize" placeholder="메모를 입력하세요…"></textarea>
        </div>
      </article>
      <div id="emptyStat" class="empty">좌측에서 조문을 선택하세요.</div>
    </section>
  </main>

  <script src="./common.js?v=6"></script>
  <script src="./statutes.js?v=6"></script>
</body>
</html>
