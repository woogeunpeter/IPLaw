<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPLaw</title>
  <link rel="stylesheet" href="./styles.css?v=1">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="btn ghost" hidden>← 뒤로</button>
    <div class="brand">⚖️ IPLaw</div>
  </header>

  <main class="wrap">
    <!-- 홈: 모드 선택 -->
    <section id="screen-home" class="screen center">
      <h1>모드를 선택하세요</h1>
      <div class="grid2">
        <button id="goStatutes" class="card big">법조문 모드</button>
        <button id="goCloze" class="card big">빈칸 퀴즈 모드</button>
      </div>
    </section>

    <!-- 법조문 모드 -->
    <section id="screen-statutes" class="screen" hidden>
      <aside class="sidebar">
        <div class="side-header">
          <select id="lawSelect" class="input">
            <option value="patent" selected>특허법(총칙)</option>
            <option value="trademark" disabled>상표법(추가 예정)</option>
            <option value="design" disabled>디자인보호법(추가 예정)</option>
          </select>
          <input id="searchInput" class="input" placeholder="번호·제목·내용 검색">
          <div class="filters">
            <label class="chip"><input type="checkbox" id="onlyBookmarks"> 북마크</label>
            <label class="chip">별점≥
              <select id="minStars" class="input input-compact">
                <option value="0" selected>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
              </select>
            </label>
          </div>
        </div>
        <div id="toc" class="toc"></div>
      </aside>

      <section class="content">
        <div class="empty">좌측 목록에서 조문을 선택하거나 검색하세요.</div>
        <article id="viewer" class="viewer" hidden>
          <div class="article-head">
            <div class="title">
              <h1 id="aTitle">제0조 제목</h1>
              <div class="meta">
                <span class="badge" id="aId">ID</span>
                <span class="stars" id="aStars">☆☆☆☆☆</span>
                <span class="badge" id="aQuizStats">0/0</span>
              </div>
            </div>
            <div class="actions">
              <label class="starset">중요도
                <select id="starSelect" class="input input-compact">
                  <option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
                </select>
              </label>
              <button id="bmBtn" class="btn ghost">★ 북마크</button>
              <button id="toQuiz" class="btn">이 조문 퀴즈</button>
            </div>
          </div>
          <div id="aBody" class="body"></div>
          <div class="note-area">
            <textarea id="noteInput" class="textarea" placeholder="메모를 입력하세요…"></textarea>
            <div class="note-row">
              <span id="noteStatus" class="muted">자동 저장됨</span>
              <div class="spacer"></div>
            </div>
          </div>
        </article>
      </section>
    </section>

    <!-- 빈칸 퀴즈 모드 -->
    <section id="screen-cloze" class="screen" hidden>
      <div class="panel">
        <div class="row gap wrap">
          <select id="lawSelectQuiz" class="input">
            <option value="patent" selected>특허법(총칙)</option>
            <option value="trademark" disabled>상표법(추가 예정)</option>
            <option value="design" disabled>디자인보호법(추가 예정)</option>
          </select>
          <label class="row gap"><span>데일리 N개</span>
            <input type="number" id="dailyCount" class="input" min="1" value="10" style="width:90px" />
          </label>
          <button id="startDaily" class="btn">데일리 시작</button>
          <input id="searchQuiz" class="input flex" placeholder="조문 번호/키워드 찾기" />
          <button id="gotoArticleQuiz" class="btn">이동</button>
        </div>
      </div>
      <article class="content">
        <div id="quizView" class="article"></div>
        <div class="row gap wrap" style="margin-top:8px">
          <button id="markCorrect" class="btn ghost">맞음</button>
          <button id="markWrong" class="btn ghost">틀림</button>
          <span id="stats" class="muted"></span>
        </div>
      </article>
    </section>
  </main>

  <footer class="footer">
    <small>로컬 저장(메모/별/북마크/퀴즈 통계) · 하이라이트 제거 · 볼드 유지</small>
  </footer>

  <script type="module" src="./app.js?v=1"></script>
</body>
</html>
