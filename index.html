<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPLaw</title>
  <link rel="stylesheet" href="./styles.css?v=1">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="btn ghost" hidden>← 뒤로</button>
    <div class="brand">⚖️ IPLaw</div>
  </header>

  <main class="wrap">
    <!-- 홈: 모드 선택 -->
    <section id="screen-home" class="screen center">
      <h1>모드를 선택하세요</h1>
      <div class="grid2">
        <button id="goStatutes" class="card big">법조문 모드</button>
        <button id="goQuiz" class="card big">빈칸 퀴즈 모드</button>
      </div>
    </section>

    <!-- 법조문 모드 (법조문만) -->
    <section id="screen-statutes" class="screen" hidden>
      <aside class="sidebar">
        <div class="side-header">
          <select id="lawSelectStat" class="input">
            <option value="patent" selected>특허법(총칙)</option>
          </select>
          <input id="searchStat" class="input" placeholder="번호·제목·내용 검색">
        </div>
        <div id="tocStat" class="toc"></div>
      </aside>

      <section class="content">
        <div class="content-header">
          <div class="row gap">
            <button id="prevStat" class="btn ghost">이전</button>
            <button id="nextStat" class="btn">다음</button>
          </div>
        </div>
        <article id="viewerStat" class="viewer" hidden>
          <h1 id="titleStat">제0조 제목</h1>
          <div id="bodyStat" class="body"></div>
          <div class="note-area">
            <textarea id="noteStat" class="textarea" placeholder="메모를 입력하세요…"></textarea>
            <div class="note-row">
              <span id="noteStatus" class="muted">자동 저장됨</span>
            </div>
          </div>
        </article>
        <div id="emptyStat" class="empty">좌측에서 조문을 선택하세요.</div>
      </section>
    </section>

    <!-- 빈칸 퀴즈 모드 (빈칸만) -->
    <section id="screen-quiz" class="screen" hidden>
      <aside class="sidebar">
        <div class="side-header">
          <select id="lawSelectQuiz" class="input">
            <option value="patent" selected>특허법(총칙)</option>
          </select>
          <input id="searchQuiz" class="input" placeholder="번호·제목·내용 검색">
        </div>
        <div id="tocQuiz" class="toc"></div>
      </aside>

      <section class="content">
        <div class="content-header">
          <div class="row gap">
            <button id="prevQuiz" class="btn ghost">이전</button>
            <button id="nextQuiz" class="btn">다음</button>
          </div>
          <div class="row gap">
            <button id="markCorrect" class="btn ghost">맞음</button>
            <button id="markWrong" class="btn ghost">틀림</button>
            <span id="stats" class="muted"></span>
          </div>
        </div>
        <article id="viewerQuiz" class="viewer" hidden>
          <h1 id="titleQuiz">제0조 제목</h1>
          <div id="bodyQuiz" class="body"></div>
        </article>
        <div id="emptyQuiz" class="empty">좌측에서 퀴즈를 선택하세요.</div>
      </section>
    </section>
  </main>

  <footer class="footer">
    <small>엄격 분리: 법조문=법조문만 · 퀴즈=빈칸만 / 좌측 스크롤 + "다음" 버튼</small>
  </footer>

  <script type="module" src="./app.js?v=1"></script>
</body>
</html>
